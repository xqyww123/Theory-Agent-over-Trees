[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isabelle_theory_agent"
# Read from ./VERSION: one number for the wheel and the conda recipe.
dynamic = ["version"]
description = "An agent that writes Isabelle theories by editing a forest of trees"
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["COPYING", "COPYING.LIB", "COPYRIGHT"]
authors = [
    { name = "Qiyuan Xu", email = "xqyww123@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "isabelle-rpc>=0.4.0",
    "msgpack>=1.1.2",
]

[project.urls]
"Homepage" = "https://github.com/xqyww123/Theory-Agent-over-Trees"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["isabelle_theory_agent", "isabelle_theory_agent.*"]
